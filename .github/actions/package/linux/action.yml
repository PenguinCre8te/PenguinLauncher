name: Package for Linux
description: Create Linux packages for Penguin Launcher

inputs:
  version:
    description: Launcher version
    required: true
  build-type:
    description: Type for the build
    required: true
    default: Debug
  artifact-name:
    description: Name of the uploaded artifact
    required: true
    default: Linux
  qt-version:
    description: Version of Qt to use
    required: true
  gpg-private-key:
    description: Private key for AppImage signing
    required: false
  gpg-private-key-id:
    description: ID for the gpg-private-key, to select the signing key
    required: false

runs:
  using: composite

  steps:
    - name: Cleanup Qt installation on Linux
      shell: bash
      run: |
        rm -rf "$QT_PLUGIN_PATH"/printsupport
        rm -rf "$QT_PLUGIN_PATH"/sqldrivers
        rm -rf "$QT_PLUGIN_PATH"/help
        rm -rf "$QT_PLUGIN_PATH"/designer
        rm -rf "$QT_PLUGIN_PATH"/qmltooling
        rm -rf "$QT_PLUGIN_PATH"/qmlls
        rm -rf "$QT_PLUGIN_PATH"/qmllint
        rm -rf "$QT_PLUGIN_PATH"/platformthemes/libqgtk3.so

    - name: Setup build variables
      shell: bash
      run: |
        # Fixup architecture naming for AppImages and Debian
        dpkg_arch="$(dpkg-architecture -q DEB_HOST_ARCH_CPU)"
        case "$dpkg_arch" in
          "amd64")
            APPIMAGE_ARCH="x86_64"
            DEB_ARCH="amd64"
            ;;
          "arm64")
            APPIMAGE_ARCH="aarch64"
            DEB_ARCH="arm64"
            ;;
          *)
            echo "# The Debian architecture \"$dpkg_arch\" is not recognized!" >> "$GITHUB_STEP_SUMMARY"
            exit 1
            ;;
        esac
        echo "APPIMAGE_ARCH=$APPIMAGE_ARCH" >> "$GITHUB_ENV"
        echo "DEB_ARCH=$DEB_ARCH" >> "$GITHUB_ENV"

        # Used for the file paths of libraries
        echo "DEB_HOST_MULTIARCH=$(dpkg-architecture -q DEB_HOST_MULTIARCH)" >> "$GITHUB_ENV"

    - name: Package AppImage
      shell: bash
      env:
        VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        BUILD_DIR: build
        INSTALL_APPIMAGE_DIR: install-appdir

        GPG_PRIVATE_KEY: ${{ inputs.gpg-private-key }}
      run: |
        cmake --install ${{ env.BUILD_DIR }} --config ${{ inputs.build-type }} --prefix ${{ env.INSTALL_APPIMAGE_DIR }}

        if [ '${{ inputs.gpg-private-key-id }}' != '' ]; then
          echo "$GPG_PRIVATE_KEY" > privkey.asc
          gpg --import privkey.asc
          gpg --export --armor ${{ inputs.gpg-private-key-id }} > pubkey.asc
        else
          echo ":warning: Skipped code signing for Linux AppImage, as gpg key was not present." >> $GITHUB_STEP_SUMMARY
        fi

        sharun lib4bin \
          --hard-links \
          --with-hooks \
          --dst-dir "$INSTALL_APPIMAGE_DIR" \
          "$INSTALL_APPIMAGE_DIR"/bin/* "$QT_PLUGIN_PATH"/*/*.so

        cp ~/bin/AppImageUpdate.AppImage "$INSTALL_APPIMAGE_DIR"/bin/
        # FIXME(@getchoo): gamemode doesn't seem to be very portable with DBus. Find a way to make it work!
        find "$INSTALL_APPIMAGE_DIR" -name '*gamemode*' -exec rm {} +

        #disable OpenGL and Vulkan launcher features until https://github.com/VHSgunzo/sharun/issues/35
        echo "PRISMLAUNCHER_DISABLE_GLVULKAN=1" >> "$INSTALL_APPIMAGE_DIR"/.env
        #makes the launcher use portals for file picking
        echo "QT_QPA_PLATFORMTHEME=xdgdesktopportal" >> "$INSTALL_APPIMAGE_DIR"/.env
        ln -s org.penguinlauncher.PenguinLauncher.metainfo.xml "$INSTALL_APPIMAGE_DIR"/share/metainfo/org.penguinlauncher.PenguinLauncher.appdata.xml
        ln -s share/applications/org.penguinlauncher.PenguinLauncher.desktop "$INSTALL_APPIMAGE_DIR"
        ln -s share/icons/hicolor/256x256/apps/org.penguinlauncher.PenguinLauncher.png "$INSTALL_APPIMAGE_DIR"
        mv "$INSTALL_APPIMAGE_DIR"/{sharun,AppRun}
        ls -la "$INSTALL_APPIMAGE_DIR"

        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          APPIMAGE_DEST="PenguinLauncher-Linux-$APPIMAGE_ARCH.AppImage"
        else
          APPIMAGE_DEST="PenguinLauncher-Linux-$VERSION-${{ inputs.build-type }}-$APPIMAGE_ARCH.AppImage"
        fi

        mkappimage \
          --updateinformation "gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|latest|PenguinLauncher-Linux-$APPIMAGE_ARCH.AppImage.zsync" \
          "$INSTALL_APPIMAGE_DIR" \
          "$APPIMAGE_DEST"

    - name: Package portable tarball
      shell: bash
      env:
        BUILD_DIR: build

        INSTALL_PORTABLE_DIR: install-portable
      run: |
        cmake --install ${{ env.BUILD_DIR }} --config ${{ inputs.build-type }} --prefix ${{ env.INSTALL_PORTABLE_DIR }}
        cmake --install ${{ env.BUILD_DIR }} --config ${{ inputs.build-type }} --prefix ${{ env.INSTALL_PORTABLE_DIR }} --component portable

        sharun lib4bin \
          --with-hooks \
          --hard-links \
          --dst-dir "$INSTALL_PORTABLE_DIR" \
          "$INSTALL_PORTABLE_DIR"/bin/* "$QT_PLUGIN_PATH"/*/*.so

        # FIXME(@getchoo): gamemode doesn't seem to be very portable with DBus. Find a way to make it work!
        find "$INSTALL_PORTABLE_DIR" -name '*gamemode*' -exec rm {} +

        for l in $(find ${{ env.INSTALL_PORTABLE_DIR }} -type f -o -type l); do l=${l#$(pwd)/}; l=${l#${{ env.INSTALL_PORTABLE_DIR }}/}; l=${l#./}; echo $l; done > ${{ env.INSTALL_PORTABLE_DIR }}/manifest.txt
        cd ${{ env.INSTALL_PORTABLE_DIR }}
        tar -czf ../PenguinLauncher-portable.tar.gz *

    - name: Package Debian Archive (.deb)
      shell: bash
      env:
        VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        INSTALL_PORTABLE_DIR: install-portable
        DEB_WORKSPACE: deb-package-root
      run: |
        # Ensure version starts with a number for dpkg validation compatibility
        DEB_VERSION="${VERSION}"
        if [[ ! "$DEB_VERSION" =~ ^[0-9] ]]; then
          DEB_VERSION="0.0.0-git.${VERSION}"
        fi
        echo "Sanitized Debian Version: $DEB_VERSION"
        
        # Create standard /usr landing zones
        mkdir -p "${{ env.DEB_WORKSPACE }}/usr"
        
        # Copy bin, share, lib compiled data to /usr structure
        cp -r "${{ env.INSTALL_PORTABLE_DIR }}"/{bin,share,shared} "${{ env.DEB_WORKSPACE }}/usr/" 2>/dev/null || true

        # -------------------------------------------------------------
        # STRIP OUT NATIVE DEPENDENCY REDUNDANCIES
        # -------------------------------------------------------------
        echo "--- Stripping duplicate dependencies from package root ---"
        
        # 1. Drop critical system conflicts
        rm -f "${{ env.DEB_WORKSPACE }}/usr/bin/xdg-open"
        rm -f "${{ env.DEB_WORKSPACE }}/usr/bin/gio-launch-desktop"
        
        # 2. Drop standard configuration structures & layout directories
        rm -rf "${{ env.DEB_WORKSPACE }}/usr/etc"
        rm -rf "${{ env.DEB_WORKSPACE }}/usr/share/X11"
        rm -rf "${{ env.DEB_WORKSPACE }}/usr/share/glib-2.0"

        # 3. Aggressively strip host libraries from the shared/lib target
        TARGET_LIB_DIR="${{ env.DEB_WORKSPACE }}/usr/shared/lib"
        if [ -d "$TARGET_LIB_DIR" ]; then
            # Core system primitives
            rm -f "$TARGET_LIB_DIR"/libc.so.* "$TARGET_LIB_DIR"/libpthread.so.* "$TARGET_LIB_DIR"/libdl.so.* "$TARGET_LIB_DIR"/libm.so.* "$TARGET_LIB_DIR"/librt.so.* "$TARGET_LIB_DIR"/ld-linux-*.so.*
            rm -f "$TARGET_LIB_DIR"/libsystemd.so.* "$TARGET_LIB_DIR"/libcap.so.* "$TARGET_LIB_DIR"/libstdc++.so.* "$TARGET_LIB_DIR"/libgcc_s.so.*
            
            # Glib, DBus, and core infrastructure utils
            rm -f "$TARGET_LIB_DIR"/libglib-2.0.so.* "$TARGET_LIB_DIR"/libgmodule-2.0.so.* "$TARGET_LIB_DIR"/libgobject-2.0.so.* "$TARGET_LIB_DIR"/libgio-2.0.so.*
            rm -f "$TARGET_LIB_DIR"/libdbus-1.so.* "$TARGET_LIB_DIR"/libffi.so.* "$TARGET_LIB_DIR"/libselinux.so.* "$TARGET_LIB_DIR"/libuuid.so.* "$TARGET_LIB_DIR"/libacl.so.* "$TARGET_LIB_DIR"/libblkid.so.* "$TARGET_LIB_DIR"/libmount.so.*
            
            # X11, Wayland, and UI Layout definitions
            rm -f "$TARGET_LIB_DIR"/libX11.so.* "$TARGET_LIB_DIR"/libX11-xcb.so.* "$TARGET_LIB_DIR"/libxcb*.so.* "$TARGET_LIB_DIR"/libXau.so.* "$TARGET_LIB_DIR"/libXdmcp.so.*
            rm -f "$TARGET_LIB_DIR"/libwayland*.so.* "$TARGET_LIB_DIR"/libxkbcommon*.so.* "$TARGET_LIB_DIR"/libICE.so.* "$TARGET_LIB_DIR"/libSM.so.*
            
            # Graphics stacks (Mesa/DRM/Font rendering)
            rm -f "$TARGET_LIB_DIR"/libGL*.so.* "$TARGET_LIB_DIR"/libEGL.so.* "$TARGET_LIB_DIR"/libOpenGL.so.* "$TARGET_LIB_DIR"/libgbm.so.* "$TARGET_LIB_DIR"/libdrm.so.*
            rm -f "$TARGET_LIB_DIR"/libfontconfig.so.* "$TARGET_LIB_DIR"/libfreetype.so.*
            
            # Formats, Cryptography, and Archive compressions
            rm -f "$TARGET_LIB_DIR"/libz*.so.* "$TARGET_LIB_DIR"/liblzma.so.* "$TARGET_LIB_DIR"/liblz4.so.* "$TARGET_LIB_DIR"/libbz2.so.*
            rm -f "$TARGET_LIB_DIR"/libpng*.so.* "$TARGET_LIB_DIR"/libjpeg.so.* "$TARGET_LIB_DIR"/libwebp*.so.* "$TARGET_LIB_DIR"/libtiff.so.*
            rm -f "$TARGET_LIB_DIR"/libxml2.so.* "$TARGET_LIB_DIR"/libarchive.so.* "$TARGET_LIB_DIR"/libexpat.so.* "$TARGET_LIB_DIR"/libgcrypt.so.* "$TARGET_LIB_DIR"/libgpg-error.so.*
        fi

        # Setup metadata layout with native system fallback mappings
        mkdir -p "${{ env.DEB_WORKSPACE }}/DEBIAN"
        cat <<EOF > "${{ env.DEB_WORKSPACE }}/DEBIAN/control"
        Package: penguinlauncher
        Version: ${DEB_VERSION}
        Section: utils
        Priority: optional
        Architecture: ${{ env.DEB_ARCH }}
        Maintainer: PenguinCre8te <cleverpenguinmail@gmail.com>
        Depends: libc6 (>= 2.35), libstdc++6 (>= 11), xdg-utils, libglib2.0-0 (>= 2.70), libx11-6, libxcb1, libwayland-client0, libxkbcommon0, libgl1, libegl1, libgbm1, libdrm2, fontconfig, zlib1g, libpng16-16, libdbus-1-3
        Description: An open-source Minecraft launcher with the ability to manage multiple instances, accounts and mods. Focused on user freedom and free redistributability.
        EOF

        # Maintain strict executable rules for system paths
        chmod -R 755 "${{ env.DEB_WORKSPACE }}/usr/bin/" 2>/dev/null || true

        # Build final deb package out into root directory
        dpkg-deb --build "${{ env.DEB_WORKSPACE }}" "penguinlauncher_${VERSION}_${{ env.DEB_ARCH }}.deb"
        
    - name: Upload binary tarball
      uses: actions/upload-artifact@v7
      with:
        name: PenguinLauncher-${{ inputs.artifact-name }}-Qt6-Portable-${{ inputs.version }}-${{ inputs.build-type }}
        path: PenguinLauncher-portable.tar.gz

    - name: Upload Debian Package
      uses: actions/upload-artifact@v7
      with:
        name: PenguinLauncher-Linux-${{ env.DEB_ARCH }}-${{ inputs.version }}-${{ inputs.build-type }}.deb
        path: penguinlauncher_*.deb

    - name: Upload AppImage
      uses: actions/upload-artifact@v7
      with:
        name: PenguinLauncher-${{ runner.os }}-${{ inputs.version }}-${{ inputs.build-type }}-${{ env.APPIMAGE_ARCH }}.AppImage
        path: PenguinLauncher-${{ runner.os }}-*${{ env.APPIMAGE_ARCH }}.AppImage

    - name: Upload AppImage Zsync
      uses: actions/upload-artifact@v7
      with:
        name: PenguinLauncher-${{ runner.os }}-${{ inputs.version }}-${{ inputs.build-type }}-${{ env.APPIMAGE_ARCH }}.AppImage.zsync
        path: PenguinLauncher-${{ runner.os }}-*${{ env.APPIMAGE_ARCH }}.AppImage.zsync